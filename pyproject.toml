[project]
name = "seedance-client"
version = "0.1.0"
description = "Independent sample client for Seedance video generation on BytePlus ModelArk"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
seedance = "seedance_client.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
